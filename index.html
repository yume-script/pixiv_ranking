<div class="pr-plugin-container">
  <div class="pr-header-banner">
    <div class="pr-title-group">
      <h2><i class="fa-solid fa-image"></i> Pixiv 랭킹</h2>
      <p class="pr-subtitle">설정된 모드/콘텐츠 기준 픽시브 랭킹을 보여줍니다.</p>
    </div>
    <div class="pr-actions">
      <select class="pr-select" id="pr-scope-select" title="이 플러그인 설정값이 저장된 카테고리 스코프를 선택하세요">
        <option value="general">일반</option>
        <option value="adult">성인</option>
        <option value="audiobook">오디오북</option>
        <option value="video">비디오</option>
      </select>
      <select class="pr-select" id="pr-content-select">
        <option value="all">종합</option>
        <option value="illust">일러스트</option>
        <option value="ugoira">우고이라</option>
        <option value="manga">만화</option>
      </select>
      <select class="pr-select" id="pr-mode-select">
        <option value="daily">일간</option>
        <option value="weekly">주간</option>
        <option value="monthly">월간</option>
        <option value="rookie">신인</option>
        <option value="original">오리지널</option>
        <option value="daily_ai">AI생성</option>
        <option value="male">남자에게 인기</option>
        <option value="female">여자에게 인기</option>
      </select>
      <button class="pr-btn" id="pr-refresh-btn"><i class="fa-solid fa-rotate"></i> 새로고침</button>
    </div>
  </div>

  <p class="pr-scope-hint">
    "설정 적용 대상"은 실제 도서 라이브러리와 무관하게, 이 플러그인의 설정값
    (PHPSESSID 등)을 어느 카테고리 스코프에서 불러올지 선택하는 옵션입니다.
    환경설정 화면에서 저장한 스코프와 동일한 값을 선택하세요.
  </p>

  <div class="pr-status" id="pr-status">불러오는 중...</div>

  <div class="pr-grid" id="pr-grid"></div>
